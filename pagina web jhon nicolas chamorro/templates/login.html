{#
  Formulario de inicio de sesión. Ruta: auth.login (/login).
#}
{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="tarjeta tarjeta-estrecha">
  <h1>Iniciar sesión</h1>
  <form method="post" class="formulario">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Correo <input type="email" name="email" required autofocus></label>
    <label>Contraseña <input type="password" name="password" required></label>
    <button class="btn btn-primario" type="submit">Entrar</button>
  </form>
  <p class="nota">¿Eres cliente nuevo? <a href="{{ url_for('auth.registro') }}">Crea tu cuenta</a></p>
</div>
{% endblock %}
